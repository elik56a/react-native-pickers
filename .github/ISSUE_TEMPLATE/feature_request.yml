name: Feature request
description: A new component, prop or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to build
      description: The use case, not the solution. "Users book a hotel range and need to see two months at once" beats "add a prop".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The API you have in mind, or how another library does it.
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What you do today, if anything.
