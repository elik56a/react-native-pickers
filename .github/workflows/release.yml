name: Release

# release-please reads the Conventional Commits on master and keeps a "chore(release)" PR open with the
# version bump and CHANGELOG. Merging that PR tags the release, creates the GitHub release, publishes to
# npm and redeploys the docs so the new version shows up in the version dropdown.
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Opens and updates the release PR, tags the release and creates the GitHub release.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 ships npm 11, which npm Trusted Publishing (OIDC, no token) requires.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Ships the docs in the package so agents read the API offline, matching the installed version.
      - run: pnpm build:llms
      # Checks already ran above, so skip the duplicate prepublishOnly run.
      - run: npm publish --ignore-scripts

  # The tag is created with GITHUB_TOKEN, which doesn't trigger other workflows, so deploy from here.
  docs:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
