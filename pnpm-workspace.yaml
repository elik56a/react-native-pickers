packages:
  - example
  - website

onlyBuiltDependencies:
  - esbuild
  - lefthook

# Patched versions of transitive dev and docs dependencies that their parents haven't picked up yet. None of
# them ships in the package. Drop an entry once `pnpm why <name>` shows the parent resolves a patched version.
overrides:
  glob@>=9.0.0 <14.0.2: ^14.0.2
  minimatch@>=9.0.0 <11.0.1: ^11.0.1
  node-forge@<1.4.1: ^1.4.1
  serialize-javascript@<7.1.3: ^7.1.3
  tinypool@<2.1.2: ^2.1.2
  uuid@<11.1.1: ^11.1.1
  yaml@>=2.0.0 <2.8.3: ^2.8.3

auditConfig:
  ignoreGhsas:
    # deepmerge, through jest-config: no patched release exists, and Jest only merges its own config.
    - GHSA-gcqx-w48m-w2h4
    # zod 3, through the example app's Expo CLI: the fix is zod 4, a major Expo hasn't moved to, and the CLI
    # only validates its own local config.
    - GHSA-mrhx-c7xc-m3w5
    # minimatch 3, through Jest's coverage (test-exclude) and the docs dev server (serve-handler): the fix is
    # minimatch 11, whose exports glob 7 and serve-handler can't load, and both only match the repo's own patterns.
    - GHSA-g3hv-75wg-m249
